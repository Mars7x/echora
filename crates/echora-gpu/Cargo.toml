[package]
name = "echora-gpu"
description = "Vulkan backend for the NVN layer, and shader translation through the recompiler library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ash = "0.38"
echora-shader.workspace = true
echora-shader-abi.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
cc = { version = "1", features = ["parallel"] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in", "spv-out"] }

[lints]
workspace = true
