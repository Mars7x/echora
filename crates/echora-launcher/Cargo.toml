[package]
name = "echora-launcher"
description = "Echora launcher (GTK4/libadwaita on Linux)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "echora-launcher"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
echora-config.workspace = true
echora-content.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }

[lints]
workspace = true
