[package]
name = "echora-runtime"
description = "Guest runtime: process state, scheduler, SVCs, IPC and system services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
astc-decode = "0.3"
echora-audio.workspace = true
echora-config.workspace = true
echora-gpu.workspace = true
echora-shader-abi.workspace = true
echora-guest.workspace = true
echora-input.workspace = true
echora-loader.workspace = true
echora-nup.workspace = true
getrandom = { version = "0.4", features = ["std"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
miniz_oxide = "0.8"
# "asm": rav1d's hand-written SIMD (nasm on x86-64 at build time); with it
# rav1d links the 16-bit kernels too, so bitdepth_16 must be on.
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16", "asm"] }
raw-window-handle = "0.6"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
winit = "0.30"
zstd.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
echora-nup = { workspace = true, features = ["writer"] }
tempfile.workspace = true

[lints]
workspace = true
