[package]
name = "echora-aot-tests"
description = "Native execution tests: synthetic AArch64 programs lifted at build time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
echora-guest.workspace = true

[dev-dependencies]
echora-lift.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug"] }

[build-dependencies]
echora-lift.workspace = true

[lints]
workspace = true

# Guest instructions per second of lifted kernels; see docs/testing.md.
[[bench]]
name = "kernels"
harness = false
