[package]
name = "echora-aot-tests"
description = "Native execution tests: synthetic AArch64 programs lifted at build time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# With split-ticks: the step count in a window local (EmitOptions::steps_local).
steps-local = []
# With float-runs and inline-vector: S loads inside float runs
# (EmitOptions::float_run_loads).
float-run-loads = []
# Lifted functions as host functions, called directly within a region
# (EmitOptions::functions).
functions = []
# With functions: calls to lifted functions go through the per-region
# function table (EmitOptions::function_table).
function-table = []
# With functions: calls of leaf functions store and reload only what the
# leaf may touch (EmitOptions::call_summaries).
call-summaries = []
# With call-summaries: functions that call others get transitive summaries
# (EmitOptions::transitive_summaries).
transitive-summaries = []
# Scalar single-precision runs as plain host arithmetic checked once
# (EmitOptions::float_runs).
float-runs = []
# With split-ticks: blocks that cannot trap add to a pending count instead
# of charging (EmitOptions::deferred_charges).
deferred-charges = []
# Lift every program with common vector operations as native code
# (codegen's EmitOptions::inline_vector):
# `cargo test -p echora-aot-tests --features inline-vector`.
inline-vector = []
# Lift every program with structured emission (EmitOptions::structured):
# `cargo test -p echora-aot-tests --release --features structured`. The
# generated code is about twice the size, so this build is slow.
structured = ["structured-kernels"]
# Only the benchmark kernels, for measuring.
structured-kernels = []
# Lift every program with flag setters fused with their B.cond where NZCV
# is dead after the block (EmitOptions::fused_flags).
fused-flags = []
# With inline-vector: check inlined vector float operations a whole
# vector at a time (EmitOptions::whole_vector_checks).
whole-vector-checks = []
# With inline-vector: vector FSQRT, FCVTZS/FCVTZU, FRSQRTE, FRECPE and
# FRINT* per lane natively where exact (EmitOptions::inline_vector_unary).
inline-vector-unary = []
# With inline-vector: vector integer operations and element moves as
# native code (EmitOptions::inline_vector_int).
inline-vector-int = []
# With inline-vector: FADDP/FMAXP/FMINP/FMAXNMP/FMINNMP per lane natively
# where exact (EmitOptions::inline_vector_pairwise).
inline-vector-pairwise = []
# With inline-vector: scalar FMOV to/from general registers, SCVTF/UCVTF,
# FCVT*S/U, FCVT S<->D, FSQRT, FRINT* and FCCMP natively where exact
# (EmitOptions::inline_fp_scalar).
inline-fp-scalar = []
# With inline-vector: TBL/TBX, lane/replicate/multiple-structure loads and
# stores, FABD, FMULX, FMAXV and kin, and the remaining conversions as
# native code (EmitOptions::inline_vector_misc).
inline-vector-misc = []
# Debugging: count each inlined operation's helper fallbacks
# (EmitOptions::count_fallbacks).
count-fallbacks = []
# LDP/STP of Q registers through direct accesses after the checked calls'
# range test (EmitOptions::direct_q_pairs).
direct-q-pairs = []
# Keep FPCR and FPSR in window locals (EmitOptions::fp_status_locals).
fp-status-locals = []
# Split windows reach guest memory through a local copy of the access
# path (EmitOptions::window_memory).
window-memory = []
# Split windows dispatch blocks on a dense index (EmitOptions::dense_dispatch).
dense-dispatch = []
# Blocks that cannot fail after their charge store no block tag
# (EmitOptions::untagged_blocks).
untagged-blocks = []
# Blocks charge through a bool fast path, the checks only on its slow path
# (EmitOptions::split_ticks).
split-ticks = []
# A BL to a block of the caller's region calls its window directly
# (EmitOptions::direct_calls).
direct-calls = []
# Write the split programs per emission mode for `benches/codesize.rs`.
codesize = []

[dependencies]
dynasmrt.workspace = true
echora-guest.workspace = true
echora-simd.workspace = true

[dev-dependencies]
echora-lift.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug"] }

[build-dependencies]
dynasmrt.workspace = true
echora-lift.workspace = true

[lints]
workspace = true

# Guest instructions per second of lifted kernels; see docs/testing.md.
[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "lock"
harness = false

[[bench]]
name = "codesize"
harness = false
required-features = ["codesize"]
