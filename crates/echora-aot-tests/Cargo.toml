[package]
name = "echora-aot-tests"
description = "Native execution tests: synthetic AArch64 programs lifted at build time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Lift every program with common vector operations as native code
# (codegen's EmitOptions::inline_vector):
# `cargo test -p echora-aot-tests --features inline-vector`.
inline-vector = []
# Lift every program with structured emission (EmitOptions::structured):
# `cargo test -p echora-aot-tests --release --features structured`. The
# generated code is about twice the size, so this build is slow.
structured = ["structured-kernels"]
# Only the benchmark kernels, for measuring.
structured-kernels = []
# Lift every program with direct BL calls (EmitOptions::direct_calls) and
# 64 KiB regions. Uses Core::call_window.
direct-calls = []
# With direct-calls: keep 1 KiB regions, so calls between windows go
# through other regions' call slots.
small-regions = []
# Write the split programs per emission mode for `benches/codesize.rs`.
codesize = []

[dependencies]
echora-guest.workspace = true
echora-simd.workspace = true

[dev-dependencies]
echora-lift.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug"] }

[build-dependencies]
echora-lift.workspace = true

[lints]
workspace = true

# Guest instructions per second of lifted kernels; see docs/testing.md.
[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "lock"
harness = false

[[bench]]
name = "codesize"
harness = false
required-features = ["codesize"]
