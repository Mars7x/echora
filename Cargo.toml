[workspace]
resolver = "3"
members = [
    "crates/echora",
    "crates/echora-aot-tests",
    "crates/echora-audio",
    "crates/echora-config",
    "crates/echora-content",
    "crates/echora-gpu",
    "crates/echora-guest",
    "crates/echora-input",
    "crates/echora-launcher",
    "crates/echora-lift",
    "crates/echora-loader",
    "crates/echora-nup",
    "crates/echora-resolution",
    "crates/echora-runtime",
]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/Mars7x/echora"
publish = false

[workspace.dependencies]
echora-audio = { path = "crates/echora-audio" }
echora-config = { path = "crates/echora-config" }
echora-content = { path = "crates/echora-content" }
echora-gpu = { path = "crates/echora-gpu" }
echora-guest = { path = "crates/echora-guest" }
echora-input = { path = "crates/echora-input" }
echora-lift = { path = "crates/echora-lift" }
echora-loader = { path = "crates/echora-loader" }
echora-nup = { path = "crates/echora-nup" }
echora-resolution = { path = "crates/echora-resolution" }
echora-runtime = { path = "crates/echora-runtime" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
lz4_flex = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
